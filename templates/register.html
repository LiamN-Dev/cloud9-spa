{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow border-0 mt-4">
            <div class="card-body p-4">
                <h2 class="text-center fw-bold text-primary mb-3">Create Account</h2>
                <p class="text-center text-muted small mb-4">Register your family profile below. All registrations start in a <strong>Locked</strong> state until authorized by the Ultra Admin.</p>
                
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-semibold">Your Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Aunt Sarah" required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Choose Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="e.g. sarah_cloud9" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Submit Registration Request</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}" class="text-decoration-none small">Already have an account? Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
